name: Refresh Liquipedia snapshot

# Weekly top-up of the bundled scene-history dataset: new majors since the
# last snapshot, plus any newly published SSBMRank edition. Majors land more
# often than monthly, and a run with nothing new costs one request and commits
# nothing. The data ships in the bundle (the app has no backend and a
# self+Supabase CSP), so "publishing" is a commit to main — Vercel redeploys
# from there.
on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC every Monday
  workflow_dispatch: # manual run from the Actions tab
    inputs:
      render_assets:
        description: "Re-render public/share even if the data didn't change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: liquipedia-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetches only what's missing (majors dated after the snapshot, editions
      # not yet present) and rate-limits itself. Exit 2 means Liquipedia was
      # blocking us: data.ts is untouched, so treat it as "nothing to do" and
      # let next month's run pick it up rather than paging anyone with a red X.
      - name: Fetch new majors and rankings
        id: refresh
        run: |
          set +e
          node scripts/refresh-liquipedia.mjs
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning::Liquipedia rate-limited this run; snapshot unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
        env:
          LIQUIPEDIA_CONTACT: ${{ vars.LIQUIPEDIA_CONTACT || 'info.studio.pinball@gmail.com' }}

      # Assets are derived from the snapshot, so they regenerate with it — same
      # painters and encoder the in-app Share buttons use, run headlessly.
      # render_assets forces this on a manual run: the step is otherwise only
      # reachable when the data happens to change, which is no way to find out
      # that a runner can't load a font.
      - name: Render shareable assets
        if: steps.refresh.outputs.changed == 'true' || inputs.render_assets
        run: node scripts/render-liquipedia-assets.mjs

      # A broken dataset must never reach main.
      - name: Type-check and build
        if: steps.refresh.outputs.changed == 'true' || inputs.render_assets
        run: npm run build

      # SUMMARY is built from wiki-derived text (event and edition names), so it
      # is passed through the environment rather than interpolated into the
      # script — a ${{ }} expansion would let a wiki edit run commands in a job
      # that holds contents:write.
      - name: Commit the updated snapshot
        if: steps.refresh.outputs.changed == 'true' || inputs.render_assets
        env:
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/liquipedia/data.ts public/share
          # A forced render usually produces identical bytes; committing is
          # then a no-op, and `git commit` would fail the job rather than
          # shrug, so ask first.
          if git diff --cached --quiet; then
            echo "nothing changed on disk — nothing to commit"
            exit 0
          fi
          git commit -m "Liquipedia snapshot: ${SUMMARY:-re-rendered share images}"
          git push
