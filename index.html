<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://ssbmstats.com/" />
    <meta name="theme-color" content="#121022" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="SSBM Stats" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SSBM Stats" />
    <title>SSBM Stats — Private Slippi Analytics &amp; Melee History</title>
    <meta name="description" content="Explore your Slippi win rates, matchups, kill stats, and execution trends. Replays are parsed privately in your browser and never leave your machine." />

    <!--
      Link previews. og:image must be an absolute URL — crawlers don't resolve
      relative paths — so this is pinned to the production origin and will show
      production's image even when the link points at a preview deploy.

      The image is /share/melee-majors-race.png, the same poster the weekly
      workflow regenerates alongside the data, so a shared link keeps showing
      current standings instead of a screenshot that ages.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="SSBM Stats" />
    <meta property="og:url" content="https://ssbmstats.com/" />
    <meta property="og:title" content="SSBM Stats — Private Slippi analytics and Melee history" />
    <meta property="og:description" content="Your Slippi replays parsed in the browser, plus every Melee major since 2003 and the top 100 by character." />
    <meta property="og:image" content="https://ssbmstats.com/share/melee-majors-race.png" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="An all-time chart of Super Smash Bros. Melee major titles." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SSBM Stats — Private Slippi analytics and Melee history" />
    <meta name="twitter:description" content="Your Slippi replays parsed in the browser, plus every Melee major since 2003 and the top 100 by character." />
    <meta name="twitter:image" content="https://ssbmstats.com/share/melee-majors-race.png" />
    <meta name="twitter:image:alt" content="An all-time chart of Super Smash Bros. Melee major titles." />

    <!--
      Structured data. The app is a free, install-free web tool; this is what
      says so to a crawler, which otherwise has only the empty #root to go on.
      A ld+json block is data, never executed, so script-src 'self' does not
      apply — but re-check with Google's Rich Results Test after any CSP change.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SSBM Stats",
        "url": "https://ssbmstats.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any modern web browser",
        "browserRequirements": "Requires JavaScript and a File System Access or folder-upload capable browser",
        "description": "Private Slippi replay analytics for Super Smash Bros. Melee. Replays are parsed in your browser and never uploaded.",
        "inLanguage": "en-US",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "Studio Pinball" }
      }
    </script>

    <!--
      Critical styles, and only that. index.css ships with the JS bundle, so
      until that lands the page is unstyled white — and the static footer below
      #root is the one thing on screen before then. These few rules keep it dark
      and legible rather than flashing. The values are copied from the tokens in
      src/index.css; this is a pre-mount fallback, not a second source of truth.
    -->
    <style>
      html, body { margin: 0; background: #121022; color: #ece9f8;
                   font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      #static-nav { display: flex; flex-wrap: wrap; justify-content: center;
                    gap: 10px; padding: 18px; font-size: 12px; color: #8981ae; }
      #static-nav a { color: #aaa3c9; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      The only crawlable path from / to the static pages. Googlebot's first pass
      parses this HTML without running JavaScript, and #root is empty until React
      mounts, so without this a crawler landing on the homepage finds no links at
      all: /about, /metrics and /melee-majors would be reachable only through
      sitemap.xml, and the homepage would pass them nothing.

      It mirrors App.tsx's <footer class="site-footer">, and main.tsx removes it
      as it mounts, so the two are never on screen together.
    -->
    <footer id="static-nav">
      <span>SSBM Stats — Slippi replay analytics, parsed in your browser.</span>
      <a href="/about">About</a>
      <a href="/metrics">Metrics reference</a>
      <a href="/melee-majors">Melee majors</a>
      <a href="https://github.com/1973-pinball/SSBM_DASHBOARD">Source</a>
    </footer>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
