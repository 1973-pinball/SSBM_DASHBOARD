<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b58cff"/>
      <stop offset="0.58" stop-color="#8f7ff7"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c99137"/>
      <stop offset="1" stop-color="#ffd77a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#080612" flood-opacity=".45"/>
    </filter>
    <style>
      .display { font-family: 'Chakra Petch', 'Arial Narrow', system-ui, sans-serif; font-weight: 700; }
      .body { font-family: Inter, system-ui, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .card { fill: #1a1730; stroke: #34305a; stroke-width: 2; }
      .icon-bg { fill: #121022; stroke: #51497b; stroke-width: 2; }
      .name { fill: #ece9f8; font-size: 25px; letter-spacing: 2px; }
      .kicker { fill: #8f7ff7; font-size: 13px; letter-spacing: 2.6px; }
      .desc { fill: #aaa3c9; font-size: 15px; }
      .domain { fill: #8981ae; font-size: 13px; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#121022"/>
  <circle cx="110" cy="70" r="240" fill="#8f7ff7" opacity=".055"/>
  <circle cx="1320" cy="760" r="300" fill="#47bfff" opacity=".035"/>
  <text x="58" y="66" class="display" fill="#ece9f8" font-size="30" letter-spacing="3">SSBM STATS · LOGO DIRECTIONS</text>
  <text x="58" y="96" class="mono" fill="#8981ae" font-size="14">A neutral original mark — no character silhouettes, Smash Ball, or official game logo.</text>

  <!-- A: S-squared Signal -->
  <g transform="translate(46 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">01 · RECOMMENDED</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <path d="M153 54c-17-14-48-18-69-9-23 10-28 36-7 47 11 6 27 8 43 12 26 6 39 18 35 39-5 28-42 41-75 31-10-3-19-8-27-14"
            fill="none" stroke="url(#accent)" stroke-width="25" stroke-linecap="round"/>
      <path d="M55 153l31-22 29 9 39-37" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="55" cy="153" r="6" fill="#e8b54d"/>
      <circle cx="86" cy="131" r="6" fill="#e8b54d"/>
      <circle cx="115" cy="140" r="6" fill="#e8b54d"/>
      <circle cx="154" cy="103" r="6" fill="#ffd77a"/>
      <text x="158" y="69" class="display" fill="#ffd77a" font-size="32">²</text>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">S² SIGNAL</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">The two S initials become a</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">compact analytics monogram.</text>
    <text x="28" y="430" class="mono" fill="#8981ae" font-size="13">SSBM STATS</text>
    <text x="28" y="451" class="mono" fill="#8981ae" font-size="13">ssbmstats.com</text>
    <g transform="translate(28 486)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <path d="M31 11c-6-5-18-4-20 2-2 7 5 8 12 10 9 2 11 6 9 11-3 7-15 7-22 2" fill="none" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round"/>
      <text x="32" y="17" class="display" fill="#ffd77a" font-size="9">²</text>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">OWNABLE · ANALYTICAL · COMPACT</text>
  </g>

  <!-- B: Four Stocks -->
  <g transform="translate(380 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">02 · MOST LITERAL</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <path d="M45 175h134" stroke="#34305a" stroke-width="3" stroke-linecap="round"/>
      <g fill="url(#accent)">
        <rect x="47" y="138" width="24" height="37" rx="8"/>
        <rect x="82" y="112" width="24" height="63" rx="8"/>
        <rect x="117" y="83" width="24" height="92" rx="8"/>
        <rect x="152" y="48" width="24" height="127" rx="8"/>
      </g>
      <g fill="#121022" stroke="#c8b6ff" stroke-width="7">
        <circle cx="59" cy="132" r="13"/>
        <circle cx="94" cy="106" r="13"/>
        <circle cx="129" cy="77" r="13"/>
        <circle cx="164" cy="42" r="13" stroke="#ffd77a"/>
      </g>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">FOUR STOCKS</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">Stock counters double as a</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">rising four-column stat chart.</text>
    <text x="28" y="430" class="mono" fill="#8981ae" font-size="13">SSBM STATS</text>
    <text x="28" y="451" class="mono" fill="#8981ae" font-size="13">ssbmstats.com</text>
    <g transform="translate(28 486)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <g fill="url(#accent)">
        <rect x="8" y="28" width="5" height="9" rx="2"/><rect x="16" y="23" width="5" height="14" rx="2"/>
        <rect x="24" y="17" width="5" height="20" rx="2"/><rect x="32" y="10" width="5" height="27" rx="2"/>
      </g>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">MELEE-CODED · CLEAR · FRIENDLY</text>
  </g>

  <!-- C: Port Matrix -->
  <g transform="translate(714 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">03 · MOST SUBTLE</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <path d="M66 63c19-18 67-20 83 1 17 23-8 36-38 43-29 7-52 19-42 42 10 24 55 25 81 6"
            fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
      <g fill="#121022" stroke="#b7a8ff" stroke-width="7">
        <circle cx="59" cy="56" r="18"/>
        <circle cx="161" cy="56" r="18"/>
        <circle cx="59" cy="164" r="18"/>
        <circle cx="161" cy="164" r="18" stroke="#ffd77a"/>
      </g>
      <g class="mono" fill="#aaa3c9" font-size="11" text-anchor="middle">
        <text x="59" y="60">1</text><text x="161" y="60">2</text>
        <text x="59" y="168">3</text><text x="161" y="168" fill="#ffd77a">4</text>
      </g>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">PORT MATRIX</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">Four controller ports frame an</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">S-shaped replay-data path.</text>
    <text x="28" y="430" class="mono" fill="#8981ae" font-size="13">SSBM STATS</text>
    <text x="28" y="451" class="mono" fill="#8981ae" font-size="13">ssbmstats.com</text>
    <g transform="translate(28 486)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <path d="M12 11c8-8 25-4 22 4-2 5-10 5-15 8-9 4-9 12-1 14 6 2 13 0 17-4" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="3" fill="#b7a8ff"/><circle cx="35" cy="10" r="3" fill="#b7a8ff"/>
      <circle cx="10" cy="35" r="3" fill="#b7a8ff"/><circle cx="35" cy="35" r="3" fill="#ffd77a"/>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">PREMIUM · TECHNICAL · INSIDER</text>
  </g>

  <!-- D: Dashbolt -->
  <g transform="translate(1048 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">04 · CONTINUITY</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <path d="M87 38h89c10 0 14 12 8 19l-39 42c-7 8-2 20 9 20h28c10 0 14 12 8 19l-73 79c-7 8-20 3-20-8v-42c0-7-5-12-12-12H42c-10 0-14-12-8-19l38-41c7-8 2-20-9-20H44c-10 0-14-12-8-19l36-39c4-4 9-6 15-6z"
            transform="translate(0 0)" fill="url(#accent)"/>
      <circle cx="154" cy="81" r="9" fill="#ffd77a" filter="url(#glow)"/>
      <path d="M116 145l21-24 17 8 29-33" fill="none" stroke="#121022" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">DASHBOLT</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">The current speed mark evolves</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">with one embedded data signal.</text>
    <text x="28" y="430" class="mono" fill="#8981ae" font-size="13">SSBM STATS</text>
    <text x="28" y="451" class="mono" fill="#8981ae" font-size="13">ssbmstats.com</text>
    <g transform="translate(28 486)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <path d="M18 5h20L27 19h10L17 41V27H7l11-13h-8z" fill="url(#accent)"/>
      <circle cx="31" cy="15" r="2.5" fill="#ffd77a"/>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">FAST · FAMILIAR · LOW-RISK</text>
  </g>

  <text x="700" y="792" class="mono" fill="#6b6490" font-size="12" text-anchor="middle">Exploration only · proportions and micro-detail will be refined after a direction is selected.</text>
</svg>
