        <circle cx="46" cy="154" r="4"/><circle cx="58" cy="154" r="4"/>
        <circle cx="86" cy="125" r="4"/><circle cx="98" cy="125" r="4"/>
        <circle cx="126" cy="91" r="4"/><circle cx="138" cy="91" r="4"/>
        <circle cx="166" cy="51" r="4"/><circle cx="178" cy="51" r="4"/>
      </g>
      <g fill="none" stroke="#0b0915" stroke-width="4" stroke-linecap="round">
