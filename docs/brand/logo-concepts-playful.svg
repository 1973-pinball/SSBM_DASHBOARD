      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">MINIMAL · MELEE · VERY SILLY</text>
  </g>

  <!-- 4: Port Face -->
  <g transform="translate(1048 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">04 · SECRET FACE</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#9d86ff" stroke="#0b0915" stroke-width="9"/>
      <g fill="#121022" stroke="#0b0915" stroke-width="7">
        <circle cx="73" cy="75" r="25"/><circle cx="147" cy="75" r="25"/>
        <circle cx="73" cy="151" r="25"/><circle cx="147" cy="151" r="25"/>
      </g>
      <circle cx="79" cy="70" r="7" fill="#ece9f8"/><circle cx="141" cy="70" r="7" fill="#ece9f8"/>
      <path d="M83 148q27 32 54 0" fill="none" stroke="#ece9f8" stroke-width="8" stroke-linecap="round"/>
      <rect x="106" y="155" width="15" height="16" rx="3" fill="#ece9f8"/>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">PORT FACE</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">Four controller ports that are</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">also, unfortunately, a face.</text>
    <g transform="translate(28 454)">
      <rect width="44" height="44" rx="10" fill="#9d86ff" stroke="#51497b"/>
      <circle cx="14" cy="14" r="6" fill="#121022"/><circle cx="30" cy="14" r="6" fill="#121022"/>
      <circle cx="14" cy="30" r="6" fill="#121022"/><circle cx="30" cy="30" r="6" fill="#121022"/>
      <circle cx="16" cy="12" r="2" fill="#ece9f8"/><circle cx="28" cy="12" r="2" fill="#ece9f8"/>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">BOLD · ODD · GREAT APP ICON</text>
