<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .display { font-family: 'Chakra Petch', 'Arial Narrow', system-ui, sans-serif; font-weight: 700; }
      .body { font-family: Inter, system-ui, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#121022"/>
  <circle cx="105" cy="60" r="235" fill="#8f7ff7" opacity=".055"/>
  <circle cx="1335" cy="775" r="300" fill="#e8b54d" opacity=".035"/>
  <text x="58" y="66" class="display" fill="#ece9f8" font-size="30" letter-spacing="3">SSBM STATS · SIMPLER + GOOFIER</text>
  <text x="58" y="96" class="mono" fill="#8981ae" font-size="14">Flat shapes, one joke, readable at 32px. No official game marks or character silhouettes.</text>

  <!-- 1: S Goblin -->
  <g transform="translate(46 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">01 · LITTLE WEIRDO</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <path d="M154 57c-19-17-61-18-79-3-23 20-8 44 20 49l25 5c26 6 38 20 31 39-10 27-56 34-88 12"
            fill="none" stroke="#0b0915" stroke-width="40" stroke-linecap="round"/>
      <path d="M154 57c-19-17-61-18-79-3-23 20-8 44 20 49l25 5c26 6 38 20 31 39-10 27-56 34-88 12"
            fill="none" stroke="#9d86ff" stroke-width="30" stroke-linecap="round"/>
      <g fill="#ece9f8" stroke="#0b0915" stroke-width="4">
        <circle cx="119" cy="54" r="12"/><circle cx="143" cy="58" r="12"/>
      </g>
      <circle cx="122" cy="57" r="4" fill="#0b0915"/><circle cx="140" cy="61" r="4" fill="#0b0915"/>
      <path d="M112 142q15 12 31-1" fill="none" stroke="#0b0915" stroke-width="6" stroke-linecap="round"/>
      <rect x="124" y="144" width="9" height="10" rx="2" fill="#ece9f8" stroke="#0b0915" stroke-width="3"/>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">S GOBLIN</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">A plain S that looks like it</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">knows your matchup is cursed.</text>
    <g transform="translate(28 454)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <path d="M34 12c-6-6-21-5-21 3 0 5 6 6 12 7 9 2 11 7 7 12-5 6-16 5-21 1" fill="none" stroke="#9d86ff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="27" cy="12" r="3" fill="#ece9f8"/><circle cx="34" cy="14" r="3" fill="#ece9f8"/>
