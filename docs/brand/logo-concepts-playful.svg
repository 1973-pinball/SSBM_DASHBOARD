      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">SIMPLE · MEMORABLE · MASCOT-Y</text>
  </g>

