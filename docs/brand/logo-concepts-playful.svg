    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">Four little stocks accidentally</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">make a very serious chart.</text>
    <g transform="translate(28 454)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <circle cx="10" cy="33" r="6" fill="#8170df"/><circle cx="18" cy="26" r="6" fill="#8f7ff7"/>
      <circle cx="26" cy="18" r="6" fill="#a18cff"/><circle cx="34" cy="9" r="6" fill="#e8b54d"/>
      <text x="58" y="19" class="display" fill="#ece9f8" font-size="17" letter-spacing="1.8">SSBM</text>
      <text x="58" y="39" class="display" fill="#8f7ff7" font-size="17" letter-spacing="3">STATS</text>
    </g>
    <text x="28" y="586" class="mono" fill="#e8b54d" font-size="12">CLEAR · PLAYFUL · STATS-CODED</text>
  </g>

  <!-- 3: Last Stock -->
  <g transform="translate(714 134)">
    <rect width="310" height="620" rx="22" fill="#1a1730" stroke="#34305a" stroke-width="2"/>
    <text x="28" y="42" class="mono" fill="#8f7ff7" font-size="13" letter-spacing="2.6">03 · UH-OH</text>
    <g transform="translate(45 72)">
      <rect width="220" height="220" rx="49" fill="#121022" stroke="#51497b" stroke-width="2"/>
      <g stroke="#0b0915" stroke-width="9">
        <circle cx="51" cy="95" r="27" fill="#9d86ff"/>
        <circle cx="106" cy="95" r="27" fill="#9d86ff"/>
        <circle cx="161" cy="95" r="27" fill="#9d86ff"/>
        <circle cx="168" cy="162" r="27" fill="#e8b54d"/>
      </g>
      <path d="M178 124l10-14M190 138l16-5M154 127l-7-16" stroke="#e8b54d" stroke-width="7" stroke-linecap="round"/>
      <g fill="#ece9f8">
        <circle cx="45" cy="91" r="4"/><circle cx="57" cy="91" r="4"/>
        <circle cx="100" cy="91" r="4"/><circle cx="112" cy="91" r="4"/>
        <circle cx="155" cy="91" r="4"/><circle cx="167" cy="91" r="4"/>
        <circle cx="162" cy="157" r="4"/><circle cx="174" cy="157" r="4"/>
      </g>
      <path d="M159 172q9-8 18 0" fill="none" stroke="#0b0915" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="28" y="336" class="display" fill="#ece9f8" font-size="25" letter-spacing="2">LAST STOCK</text>
    <text x="28" y="369" class="body" fill="#aaa3c9" font-size="15">Four stock dots. One has made</text>
    <text x="28" y="391" class="body" fill="#aaa3c9" font-size="15">a statistically poor decision.</text>
    <g transform="translate(28 454)">
      <rect width="44" height="44" rx="10" fill="#121022" stroke="#51497b"/>
      <circle cx="9" cy="17" r="7" fill="#9d86ff"/><circle cx="22" cy="17" r="7" fill="#9d86ff"/>
      <circle cx="35" cy="17" r="7" fill="#9d86ff"/><circle cx="35" cy="34" r="7" fill="#e8b54d"/>
